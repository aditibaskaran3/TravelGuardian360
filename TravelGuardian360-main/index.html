<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1020" />
    <title>TravelGuardian360</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #070B16; }
      html.tg-light, html.tg-light body, html.tg-light #root { background: #E8EDF5; }
      body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      #root { display: flex; }
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #243049; border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      input, textarea, select { font-family: inherit; }
      .tg-pulse { animation: tgpulse 1.8s ease-out infinite; }
      @keyframes tgpulse { 0% { box-shadow: 0 0 0 0 rgba(76,141,255,.55); } 100% { box-shadow: 0 0 0 16px rgba(76,141,255,0); } }
      .tg-pulse-red { animation: tgpulsered 1.4s ease-out infinite; }
      @keyframes tgpulsered { 0% { box-shadow: 0 0 0 0 rgba(244,63,94,.6); } 100% { box-shadow: 0 0 0 26px rgba(244,63,94,0); } }
      .leaflet-container { background: #0d1424; font-family: inherit; }
      .leaflet-control-attribution { background: rgba(10,16,32,.7) !important; color: #6b7a99 !important; font-size: 9px !important; }
      .leaflet-control-attribution a { color: #8da2cc !important; }
      html:not(.tg-light) .leaflet-popup-content-wrapper, html:not(.tg-light) .leaflet-popup-tip { background: #121b2e; color: #e8eef8; }
      html:not(.tg-light) .leaflet-bar a { background: #121b2e; color: #e8eef8; border-color: #223049; }
      html.tg-light .leaflet-container { background: #e3e9f2; }
      .tg-dark-map .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) brightness(.82) contrast(.92) saturate(.55); }
    </style>
  </head>
  <body>
    <script>try{if(localStorage.getItem('tg360.theme')==='light')document.documentElement.classList.add('tg-light')}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.web.js"></script>
  </body>
</html>
